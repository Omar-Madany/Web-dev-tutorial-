<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS rock paper scissors</title>
    <link rel="stylesheet" href="CSS/style.css">
    <link rel="shortcut icon" href="images/game.png" type="image/x-icon">
</head>
<body>
    <button id="start" onclick="game()">Start</button>
    <button id="reset" onclick="resetGame()">Reset</button>
    <label for="rounds">Rounds:</label>
    <input type="number" id="rounds" name="rounds" min="1" max="10" value="1">
    <p id="score">Player: 0 | Computer: 0</p>
    <p id="game-info">ready to play?</p>
    <script src="JS/main.js"></script>
</body>
</html>
