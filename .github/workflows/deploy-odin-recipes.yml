name: Deploy Recipes

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Get repository
        uses: actions/checkout@v6

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Recipes
        uses: actions/upload-pages-artifact@v4
        with:
          path: "./web dev essentials/html essentials/odin-recipes/recipes"

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
